<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MapLibre + Sprite Quickstart</title>
  <link href="https://unpkg.com/maplibre-gl@^5.7.3/dist/maplibre-gl.css" rel="stylesheet" />
  <style>
    html, body { height: 100%; margin: 0; }
    #map { position: absolute; inset: 0; }
    .info {
      position: absolute;
      top: 12px;
      left: 12px;
      max-width: 320px;
      background: rgba(255,255,255,0.94);
      padding: 12px 16px;
      border-radius: 8px;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.15);
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="info">
    <strong>Quickstart: registerProtocolFromIcons</strong>
    <ol style="margin:6px 0; padding-left:18px;">
      <li>Load your SVG markup.</li>
      <li>Call <code>registerProtocolFromIcons</code> before creating the map.</li>
      <li>Point the style at <code>sprite://pack</code>.</li>
    </ol>
    <div id="preview-links" style="margin-top:6px; line-height:1.6;"></div>
  </div>

  <script src="https://unpkg.com/maplibre-gl@^5.7.3/dist/maplibre-gl.js"></script>
  <script type="module">
    import { loadLib } from './use-lib.js';
    const { registerProtocolFromIcons, SpriteBuilder } = await loadLib();

    // Two simple icons (loaded from local files)
    const markerSvg = await fetch('./data/marker.svg').then(r => r.text());
    const starSvg = await fetch('./data/star.svg').then(r => r.text());

    const icons = [ { id: 'marker', svg: markerSvg }, { id: 'star', svg: starSvg } ];

    // Build 1x & 2x and register protocol "sprite://pack"
    // IMPORTANT: Register the protocol BEFORE creating the map
    const unregister = await registerProtocolFromIcons(window.maplibregl, 'sprite', 'pack', icons);

    // DEBUG: also build preview object URLs so you can click/open the generated sprites
    const makePreview = async (ratio) => {
      const sb = new SpriteBuilder({ pixelRatio: ratio });
      icons.forEach(({ id, svg }) => sb.addSvg(id, svg));
      const spriteURL = await sb.exportSpriteURL();
      const jsonURL = await sb.exportJSONURL();
      return { sb, spriteURL, jsonURL };
    };
    const p1 = await makePreview(1);
    const p2 = await makePreview(2);
    const previewLinks = document.getElementById('preview-links');
    previewLinks.innerHTML = `
      <strong>Sprite preview:</strong>
      <a href="${p1.spriteURL}" target="_blank">sprite@1x.png</a> ·
      <a href="${p1.jsonURL}" target="_blank">sprite@1x.json</a>
      &nbsp;|&nbsp;
      <a href="${p2.spriteURL}" target="_blank">sprite@2x.png</a> ·
      <a href="${p2.jsonURL}" target="_blank">sprite@2x.json</a>`;

    // Create map with a minimal base style (no sprite yet)
    const map = new window.maplibregl.Map({
      container: 'map',
      style: {
        version: 8,
        sources: {},
        layers: []
      },
      center: [-74.0683, 40.35],
      zoom: 13,
    });

    // Once map is ready, set the full style including sprite
    map.on('load', () => {
      map.setStyle({
        version: 8,
        sprite: 'sprite://pack',
        glyphs: 'https://demotiles.maplibre.org/font/{fontstack}/{range}.pbf',
        sources: {
          pts: {
            type: 'geojson',
            data: './data/nj_restaurant.geojson'
          },
          osm: {
            type: 'raster',
            tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],
            tileSize: 256,
            attribution: '&copy; OpenStreetMap contributors'
          }
        },
        layers: [
          { id: 'bg', type: 'raster', source: 'osm' },
          { id: 'symbols', type: 'symbol', source: 'pts', layout: { 'icon-image': 'marker', 'icon-size': 0.9 } }
        ]
      });
    });

    // Cleanup protocol and preview URLs when the map is removed
    map.on('remove', () => {
      unregister();
      p1.sb.expire(p1.spriteURL); p1.sb.expire(p1.jsonURL);
      p2.sb.expire(p2.spriteURL); p2.sb.expire(p2.jsonURL);
    });
  </script>
</body>
</html>
