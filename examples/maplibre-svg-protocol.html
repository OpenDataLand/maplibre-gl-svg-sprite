<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MapLibre + svg:// protocol demo</title>
  <link href="https://unpkg.com/maplibre-gl@^5.7.3/dist/maplibre-gl.css" rel="stylesheet" />
  <style>
    html, body { height: 100%; margin: 0; }
    #map { position: absolute; inset: 0; }
    .info {
      position: absolute;
      top: 12px;
      left: 12px;
      max-width: 340px;
      background: rgba(255,255,255,0.94);
      padding: 12px 16px;
      border-radius: 8px;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      box-shadow: 0 6px 18px rgba(0,0,0,0.15);
      line-height: 1.45;
    }
    .info h2 { margin: 0 0 6px; font-size: 16px; }
    .info ul { margin: 6px 0 0; padding-left: 18px; }
    .info li { margin-bottom: 6px; }
    .info code {
      display: block;
      margin-top: 4px;
      background: #f5f5f5;
      padding: 4px 6px;
      border-radius: 4px;
      white-space: normal;
      word-break: break-word;
      overflow-wrap: anywhere;
    }
  </style>
  </head>
<body>
  <div id="map"></div>
  <div class="info">
    <h2>svg:// protocol with params</h2>
    <p>SVG markup stays in memory – query parameters tweak colors, size, and pixel ratio.</p>
    <ul id="svg-examples"></ul>
  </div>

  <script src="https://unpkg.com/maplibre-gl@^5.7.3/dist/maplibre-gl.js"></script>
  <script type="module">
    import { loadLib } from './use-lib.js';
    const { registerSVGProtocol } = await loadLib();

    const icons = {
      marker: '<svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="12" r="10" fill="#3FB1CE"/><circle cx="12" cy="12" r="5" fill="#fff"/></svg>',
      star: '<svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 2l2.9 6.1 6.7.9-4.8 4.6 1.2 6.7L12 17.8 6 20.3l1.2-6.7L2.4 9l6.7-.9L12 2z" fill="#F2C94C"/></svg>'
    };

    const unregisterSVG = registerSVGProtocol(window.maplibregl, 'svg', icons);

    const style = {
      version: 8,
      glyphs: 'https://demotiles.maplibre.org/font/{fontstack}/{range}.pbf',
      sources: {
        osm: {
          type: 'raster',
          tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],
          tileSize: 256,
          attribution: '&copy; OpenStreetMap contributors'
        },
        pts: {
          type: 'geojson',
          data: {
            type: 'FeatureCollection',
            features: [
              { type: 'Feature', properties: { icon: 'hot' }, geometry: { type: 'Point', coordinates: [-122.4194, 37.7749] } },
              { type: 'Feature', properties: { icon: 'cool' }, geometry: { type: 'Point', coordinates: [-122.41, 37.78] } }
            ]
          }
        }
      },
      layers: [
        { id: 'bg', type: 'raster', source: 'osm' },
        {
          id: 'symbols',
          type: 'symbol',
          source: 'pts',
          layout: {
            'icon-image': ['get', 'icon'],
            'icon-size': 1,
            'icon-allow-overlap': true
          }
        }
      ]
    };

    const map = new window.maplibregl.Map({ container: 'map', style, center: [-122.4194, 37.7749], zoom: 11 });

    map.once('load', async () => {
      const variants = [
        {
          id: 'hot',
          url: 'svg://marker.png?fg=%23ff3366&bg=%23003366&width=36&height=36&pixelRatio=2',
          description: 'Recolor marker + scale for HiDPI'
        },
        {
          id: 'cool',
          url: 'svg://star.png?fg=%23f2c94c&width=56&height=56s',
          description: 'Gold star with custom size'
        }
      ];

      const list = document.getElementById('svg-examples');
      for (const { id, url, description } of variants) {
        const li = document.createElement('li');
        li.innerHTML = `${description}<br><code>${url}</code>`;
        list.appendChild(li);

        try {
          const result = await map.loadImage(url);
          const image = (result && 'data' in result) ? result.data : result;
          if (!map.hasImage(id) && image) {
            map.addImage(id, image);
          }
        } catch (err) {
          console.error(`Failed to load ${id} from ${url}`, err);
        }
      }
    });

    // Cleanup protocol on remove
    map.on('remove', unregisterSVG);
  </script>
</body>
</html>
