<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MapLibre styleimagemissing hook</title>
  <link href="https://unpkg.com/maplibre-gl@5.7.3/dist/maplibre-gl.css" rel="stylesheet" />
  <style>
    html, body { height: 100%; margin: 0; }
    #map { position: absolute; inset: 0; }
    .info {
      position: absolute;
      top: 12px;
      left: 12px;
      max-width: 300px;
      background: rgba(255, 255, 255, 0.94);
      border-radius: 8px;
      padding: 12px 16px;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.15);
      line-height: 1.45;
    }
    .info[open] { padding-bottom: 16px; }
    .info summary {
      margin: -12px -16px 8px;
      padding: 12px 16px;
      cursor: pointer;
      font-weight: 600;
      font-size: 16px;
      list-style: none;
    }
    .info summary::-webkit-details-marker { display: none; }
    .info code { background: #f5f5f5; padding: 0 4px; border-radius: 4px; }
  </style>
  <link rel="stylesheet" href="./panels.css" />
</head>
<body>
  <div id="map"></div>
  <details class="info" open>
    <summary>styleimagemissing 101</summary>
    <p>Whenever a style requests an unknown icon, we draw <code>marker.svg</code> on the fly.</p>
    <p>Try tweaking <code>?width</code>, <code>?height</code>, or <code>?fg</code> in the style definition.</p>
  </details>

  <script src="./collapsible.js"></script>
  <script src="https://unpkg.com/maplibre-gl@5.7.3/dist/maplibre-gl.js" defer></script>
  <script type="module">
    import { loadLib } from './use-lib.js';
    const { registerNamedImageHandlers, ops } = await loadLib();

    // Load the SVG we will rasterize when MapLibre asks for an icon.
    const markerSvg = await fetch('./data/marker.svg').then((res) => res.text());

    // Minimal style: OSM raster background + a GeoJSON layer.
    const map = new window.maplibregl.Map({
      container: 'map',
      style: {
        version: 8,
        glyphs: 'https://demotiles.maplibre.org/font/{fontstack}/{range}.pbf',
        sources: {
          osm: {
            type: 'raster',
            tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],
            tileSize: 256,
            attribution: '&copy; OpenStreetMap contributors'
          },
          restaurants: {
            type: 'geojson',
            data: './data/nj_restaurant.geojson'
          }
        },
        layers: [
          { id: 'basemap', type: 'raster', source: 'osm' },
          {
            id: 'pins',
            type: 'symbol',
            source: 'restaurants',
            layout: {
              // Named route example: use built-in $svg and select which SVG via overlay=marker
              'icon-image': '$svg?width=28&height=28&overlay=marker&fg=%233fb1ce',
              'icon-allow-overlap': true
            }
          }
        ]
      },
      center: [-74.0683, 40.35],
      zoom: 13
    });

    // Register a named route using the built-in "$svg" pipeline
    const unregister = registerNamedImageHandlers(map, {
      '$svg': ops.overlaySvg({ marker: markerSvg })
    }, { debug: false });

    map.on('remove', unregister);
  </script>
</body>
</html>
