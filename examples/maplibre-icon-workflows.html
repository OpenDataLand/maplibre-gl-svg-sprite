<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MapLibre Icon Workflows</title>
  <link href="https://unpkg.com/maplibre-gl@5.7.3/dist/maplibre-gl.css" rel="stylesheet" />
  <style>
    html, body { height: 100%; margin: 0; }
    #map { position: absolute; inset: 0; }
    details.info {
      position: absolute;
      top: 12px;
      left: 12px;
      max-width: 320px;
      background: rgba(255, 255, 255, 0.94);
      border-radius: 8px;
      padding: 12px 16px;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.15);
      line-height: 1.4;
    }
    details.info[open] { padding-bottom: 16px; }
    details.info summary {
      margin: -12px -16px 6px;
      padding: 12px 16px;
      font-weight: 600;
      font-size: 16px;
      cursor: pointer;
      list-style: none;
    }
    details.info summary::-webkit-details-marker { display: none; }
    details.info ul { padding-left: 18px; margin: 0; }
    details.info li { margin: 0 0 8px; }
    details.info code {
      display: block;
      margin-top: 4px;
      background: #f5f5f5;
      padding: 4px 6px;
      border-radius: 4px;
      white-space: normal;
      word-break: break-word;
      overflow-wrap: anywhere;
    }
  </style>
  <link rel="stylesheet" href="./panels.css" />
</head>
<body>
  <div id="map"></div>
  <details class="info" open>
    <summary>Icon Workflows</summary>
    <p>Each marker below is generated on-demand with <code>registerStyleImageMissingHandler</code>.</p>
    <ul id="example-list"></ul>
  </details>

  <script src="./collapsible.js"></script>
  <script src="https://unpkg.com/maplibre-gl@5.7.3/dist/maplibre-gl.js" defer></script>
  <script type="module">
    import { loadLib } from './use-lib.js';
    const { registerStyleImageMissingHandler, ops } = await loadLib();

    // 1) Define the SVG building blocks that the ops can reference.
    const svgIcons = {
      pin: `<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
        <path data-bg d="M32 2C21 2 12 11 12 22.5c0 14.3 16 33.2 19.2 36.9a2 2 0 0 0 3.6 0C37 55.7 53 36.8 53 22.5 53 11 43 2 32 2z" fill="#3FB1CE"/>
        <circle data-fg cx="32" cy="23" r="10" fill="#ffffff"/>
      </svg>`,
      badge: `<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
        <circle cx="48" cy="16" r="12" fill="#d32f2f" />
        <circle data-fg cx="48" cy="16" r="7" fill="#ffffff" />
      </svg>`,
      star: `<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
        <path data-fg d="M32 8l7.4 14.9 16.4 2.4-11.9 11.5 2.8 16.4L32 45.8 17.3 53.2l2.8-16.4L8.2 25.3l16.4-2.4z" fill="#f2c94c" stroke="#c89b1f" stroke-width="2" />
      </svg>`,
      shield: `<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
        <path data-bg d="M6 22C18 8 46 8 58 22v18c0 16-22 22-26 22S6 56 6 40Z" fill="#003366"/>
        <path data-fg d="M6 22C18 8 46 8 58 22H6Z" fill="#cc0000"/>
      </svg>`,
      tree: `<svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path data-fg d="M12 2 20 16h-5l4 6H5l4-6H4l8-14z" fill="#2e7d32" />
      </svg>`,
      tent: `<svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path data-fg d="M2 20h20l-7-12-3 5-3-5z" fill="#6d4c41" />
      </svg>`,
      water: `<svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path data-fg d="M3 18c3 0 3-2 6-2s3 2 6 2 3-2 6-2" fill="none" stroke="#2196f3" stroke-width="2" stroke-linecap="round"/>
      </svg>`,
      statue: `<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
        <!-- Torch -->
        <path d="M20 2c1 0 2 1 2 2s-1 2-2 2-2-1-2-2 1-2 2-2z" fill="#f7e27c"/>
        <rect x="19.4" y="6" width="1.2" height="4" fill="#2f7c68"/>

        <!-- Crown + head -->
        <circle cx="16" cy="12" r="2" fill="#4caf93"/>
        <path d="M16 8v-2M14.8 8.4l-1.5-1M17.2 8.4l1.5-1" stroke="#4caf93" stroke-width="1.2" stroke-linecap="round"/>

        <!-- Robe -->
        <path d="M12 14h8v10h-8z" fill="#3a9d85"/>
        <rect x="13" y="24" width="6" height="4" fill="#2f7c68"/>

        <!-- Base -->
        <rect x="11" y="28" width="10" height="2" fill="#2c6353"/>
      </svg>`,
      usShield: `<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
        <path data-bg d="M12 8h40l2 16c0 15-13 26-22 30-9-4-22-15-22-30z" fill="#0f4c81"/>
        <path data-fg d="M14 10h36l1.5 15.5C51 38 41 46 32 50c-9-4-19-12-19.5-24.5z" fill="#ffffff"/>
      </svg>`,
      boardwalk: `<svg width="40" height="40" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
        <rect x="4" y="24" width="32" height="8" fill="#c97a2c" />
        <path d="M0 32h40" stroke="#8d5524" stroke-width="2" />
        <path d="M6 28h28" stroke="#e8b07a" stroke-width="2" />
        <path d="M4 20c4-3 8-3 12 0s8 3 12 0 8-3 12 0" fill="none" stroke="#2196f3" stroke-width="2" />
        <circle cx="32" cy="10" r="4" fill="#ffd166" />
      </svg>`,
      lighthouse: `<svg width="40" height="40" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
        <rect x="17" y="14" width="6" height="18" fill="#f5f5f5" stroke="#1e3d59" stroke-width="1" />
        <polygon points="20,6 24,14 16,14" fill="#1e3d59" />
        <rect x="15" y="32" width="10" height="2" fill="#1e3d59" />
        <circle cx="20" cy="10" r="2" fill="#ffeb3b" />
      </svg>`
    };

    // 2) Describe the demos we want to render.
    const samples = [
      {
        id: 'liberty-state-park',
        description: 'Liberty State Park (Jersey City)',
        coords: [-74.0551, 40.7033],
        icon: 'liberty-park?overlay=pin,statue&fg=%239acd32&bg=%230a3d62&width=64&height=64'
      },
      {
        id: 'us-route-1',
        description: 'US Route 1 Corridor (Mercer County)',
        coords: [-74.658, 40.295],
        icon: 'us-route-1?overlay=usShield&fg=%23ffffff&bg=%23003366&text=1&fontSize=26&textStrokeWidth=4&width=64&height=64'
      },
      {
        id: 'asbury-boardwalk',
        description: 'Asbury Park Boardwalk',
        coords: [-74.0129, 40.2203],
        icon: 'asbury-boardwalk?overlay=pin,boardwalk&fg=%23ffb347&bg=%23006ba6&width=64&height=64'
      },
      {
        id: 'high-point',
        description: 'High Point State Park',
        coords: [-74.6614, 41.3212],
        icon: 'camp-grid?icons=tree,tent,water&columns=3&gap=2&width=90&height=32&cellBg=%2300233f&cellR=6&iconPad=2&iconScale=0.85'
      },
      {
        id: 'cape-may-lighthouse',
        description: 'Cape May Lighthouse',
        coords: [-74.9603, 38.9312],
        icon: 'cape-may?overlay=pin,lighthouse&fg=%23fff4e6&bg=%23004e92&width=64&height=64'
      }
    ];

    // Build a FeatureCollection for the map.
    const featureCollection = {
      type: 'FeatureCollection',
      features: samples.map(({ icon, coords }) => ({
        type: 'Feature',
        properties: { icon },
        geometry: { type: 'Point', coordinates: coords }
      }))
    };

    // 3) MapLibre map using the generated icons.
    const map = new window.maplibregl.Map({
      container: 'map',
      style: {
        version: 8,
        glyphs: 'https://demotiles.maplibre.org/font/{fontstack}/{range}.pbf',
        sources: {
          osm: {
            type: 'raster',
            tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],
            tileSize: 256,
            attribution: '&copy; OpenStreetMap contributors'
          },
          samples: {
            type: 'geojson',
            data: featureCollection
          }
        },
        layers: [
          { id: 'background', type: 'raster', source: 'osm' },
          {
            id: 'icons',
            type: 'symbol',
            source: 'samples',
            layout: {
              'icon-image': ['get', 'icon'],
              'icon-allow-overlap': true
            }
          }
        ]
      },
      center: [-74.5, 40.2],
      zoom: 7
    });

    const bounds = samples.reduce((acc, { coords }) => {
      if (!acc) return new window.maplibregl.LngLatBounds(coords, coords);
      acc.extend(coords);
      return acc;
    }, null);

    if (bounds) {
      map.on('load', () => {
        map.fitBounds(bounds, { padding: 80, maxZoom: 9 });
      });
    }

    // 4) Register the handler with a pipeline of overlay ops.
    const unregister = registerStyleImageMissingHandler(map, {
      svgIcons,
      postprocessCanvas: ops.chain(
        ops.overlaySvg(svgIcons),
        ops.overlayText(),
        ops.overlayGrid(svgIcons)
      ),
      debug: false
    });

    map.on('remove', unregister);

    // Populate the legend with the example strings so you can copy/paste them.
    const list = document.getElementById('example-list');
    samples.forEach(({ description, icon }) => {
      const li = document.createElement('li');
      li.innerHTML = `${description}<br><code>${icon}</code>`;
      list.appendChild(li);
    });
  </script>
</body>
</html>
